<!-- Linux fork addition: server-filesystem folder picker modal (see folder-browser.js).
     Opened above the setup prompt or control panel, so it sits one layer higher (z-[70]). -->
<div x-show="folderBrowser.open" x-cloak
     class="fixed inset-0 z-[70] flex items-center justify-center backdrop-blur-sm bg-black/60"
     @keydown.escape.window="closeFolderBrowser()">
    <div class="relative w-full max-w-lg max-h-[80vh] mx-4 rounded-xl border border-gray-600 bg-surface shadow-2xl flex flex-col overflow-hidden"
         @click.outside="closeFolderBrowser()">

        <div class="flex items-center gap-3 border-b border-gray-700 px-5 py-3 shrink-0">
            <iconify-icon icon="heroicons:folder" width="20" height="20" class="text-indigo-400 shrink-0"></iconify-icon>
            <h2 class="text-sm font-semibold text-white">Select Mods Folder</h2>
        </div>

        <!-- Quick-access shortcuts: only the install locations that actually exist on this machine. -->
        <div x-show="folderBrowser.shortcuts.length > 0" class="flex flex-wrap gap-1.5 px-5 pt-3 shrink-0">
            <template x-for="s in folderBrowser.shortcuts" :key="s.path">
                <button type="button" @click="browseFolderPath(s.path)"
                    class="px-2 py-1 rounded text-[11px] bg-surface-raised text-gray-300 hover:bg-gray-600 transition"
                    x-text="s.label"></button>
            </template>
        </div>

        <!-- Current path + up-one-level -->
        <div class="flex items-center gap-2 px-5 pt-3 shrink-0">
            <button type="button" @click="folderBrowser.parent && browseFolderPath(folderBrowser.parent)"
                :disabled="!folderBrowser.parent"
                class="px-2 py-1.5 rounded bg-surface-raised text-gray-300 hover:bg-gray-600 disabled:opacity-40 disabled:cursor-not-allowed transition shrink-0"
                aria-label="Go up one folder">
                <iconify-icon icon="heroicons:arrow-up" width="14" height="14"></iconify-icon>
            </button>
            <input type="text" :value="folderBrowser.path"
                @keydown.enter="browseFolderPath($event.target.value)"
                class="flex-1 bg-surface-alt border border-gray-600 rounded px-2 py-1.5 text-xs font-mono text-gray-200 focus:outline-none focus:border-indigo-500" />
        </div>
        <p x-show="folderBrowser.error" x-text="folderBrowser.error" class="text-[11px] text-red-400 px-5 pt-1 shrink-0"></p>

        <!-- Subfolder list -->
        <div class="flex-1 overflow-y-auto px-5 py-3 min-h-[12rem]">
            <div class="space-y-0.5">
                <template x-for="f in folderBrowser.folders" :key="f.path">
                    <button type="button" @click="browseFolderPath(f.path)"
                        class="w-full flex items-center gap-2 px-2 py-1.5 rounded text-left text-sm text-gray-200 hover:bg-white/5 transition">
                        <iconify-icon icon="heroicons:folder" width="16" height="16" class="text-gray-500 shrink-0"></iconify-icon>
                        <span class="truncate" x-text="f.name"></span>
                    </button>
                </template>
                <p x-show="folderBrowser.folders.length === 0" class="text-xs text-gray-500 px-2 py-1.5">No subfolders here.</p>
            </div>
        </div>

        <div class="flex items-center justify-end gap-2 border-t border-gray-700 px-5 py-3 shrink-0">
            <button type="button" @click="closeFolderBrowser()"
                class="px-3 py-1.5 rounded text-xs text-gray-300 hover:bg-white/5 transition">Cancel</button>
            <button type="button" @click="selectFolderBrowserResult()"
                class="px-3 py-1.5 bg-accent hover:bg-accent-hover text-white rounded text-xs font-medium transition">
                Select This Folder
            </button>
        </div>
    </div>
</div>
